# Security floors for transitive deps. Bounded to the major each consumer
# expects — a bare '>=' let js-yaml jump to 5.x and fast-uri to 4.x, which is a
# breaking upgrade forced on astro and ajv rather than a patch.
overrides:
  svgo: '>=4.0.2'
  brace-expansion: '>=5.0.9 <6'
  fast-uri: '>=3.1.5 <4'
  hono: '>=4.12.34 <5'
  ip-address: '>=10.3.1 <11'
  js-yaml: '>=4.3.1 <5'
  nanoid: '>=3.3.17 <4'
allowBuilds:
  esbuild: true
  msw: true
  sharp: true
minimumReleaseAgeExclude:
  - '@facet-ui/theme@0.3.0 || 0.3.1 || 0.4.0'
  - '@loom-dev/layout@0.2.0 || 0.2.1 || 0.3.0 || 0.6.1 || 0.6.4 || 0.7.0 || 0.7.1 || 0.8.0 || 0.9.2 || 0.10.0 || 0.10.2 || 0.11.0'
