name: Deploy Docs to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DOCS_SITE_URL: ${{ vars.DOCS_SITE_URL }}
      # The scenes are checked out at `.preview-src/lattice-ui` below — the same
      # path `pnpm link:preview-src` links locally, so the scene lookup resolves
      # here with no extra configuration.
      #
      # Deploys must include previews: a missing/empty checkout should fail the
      # build loudly rather than silently skip (the local default is a soft skip).
      PREVIEW_BUILD_STRICT: "1"
    steps:
      - name: Checkout docs
        uses: actions/checkout@v7

      # The interactive component previews are rendered by Loom (`loom-dev`, an
      # ordinary dependency, wasm engine prebuilt in the tarball) from the
      # lattice-ui preview targets. lattice-ui is public, so no token is needed.
      - name: Checkout lattice-ui
        uses: actions/checkout@v7
        with:
          repository: astra-void/lattice-ui
          path: .preview-src/lattice-ui

      # Facet's registry components are never published to npm — they are text
      # on a static registry its CLI copies into a project — so the Facet
      # previews are rendered straight out of the repo. Nothing here is
      # installed: the registry sources import only `@lattice-ui/*` and
      # `@facet-ui/react-variants`, and both reach Loom as shims.
      - name: Checkout facet
        uses: actions/checkout@v7
        with:
          repository: astra-void/facet
          path: .preview-src/facet

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install docs dependencies
        run: pnpm install --frozen-lockfile

      # lattice-ui is consumed from source by Loom, so only the workspace links
      # are needed — skip its build/prepare scripts (roblox-ts compile).
      - name: Install lattice-ui workspace links
        working-directory: .preview-src/lattice-ui
        run: pnpm install --frozen-lockfile --ignore-scripts

      # The `loom-preview` Astro integration emits dist/loom-preview/ as part of
      # the build, so the previews always match the checkout installed above.
      - name: Build docs
        run: pnpm build

      - name: Create CNAME file
        if: vars.DOCS_CUSTOM_DOMAIN != ''
        run: echo "${{ vars.DOCS_CUSTOM_DOMAIN }}" > dist/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
